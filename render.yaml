services:
  - type: web
    name: my-band
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "5600"
      - key: ONEID_URL
        value: "https://oneid-icvq.onrender.com"
      - key: HELPDESK_URL
        value: "https://oneid-helpdesk.onrender.com/?service=MY%20BAND"
